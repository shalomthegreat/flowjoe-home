# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check film pages are up to date
        run: |
          node scripts/build-watch-film-pages.mjs --check || { echo "::error::watch/ film pages are stale. Run: node scripts/build-watch-film-pages.mjs and commit the result."; exit 1; }
      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Upload artifact
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Wait for the Pages artifact to become visible
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          artifact_api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          artifact_filter='.artifacts[] | select(.name == "github-pages" and .expired == false) | .id'
          for attempt in {1..24}; do
            artifact_id="$(timeout 8s gh api "$artifact_api" --jq "$artifact_filter")" || artifact_id=""
            if [[ "$artifact_id" == "$PAGES_ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages could not see the uploaded artifact."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
